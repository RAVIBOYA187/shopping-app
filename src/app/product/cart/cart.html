<main>

    <section>
        @for (item of productsList(); track item.id) {
        <aside>
            <!-- <img [src]="item.image" [alt]="item.id" [routerLink]="['/showDetails' , item.id]"> -->
            <img [src]="item.image" [alt]="item.id" [routerLink]="['/products',item.id ]">

            <!-- <p style="display: none;" {{ totalAmount()=totalAmount + item.price}}>hhhh</p> -->
            <!-- <p>jjj</p> -->
            <p> {{ item.title}}</p>
            <p> {{ item.price | currency}} </p>
            <!-- <button>Buy Now</button> -->
            <p> Count : {{item.count}}</p>
            <button class="incrementBtn" (click)="increment(item)">+</button>

            <!-- <button class="removeBtn" (click)="removeFromCart(item)">Remove</button> -->
            <button class="removeBtn" (click)="removeCartItemFromLS(item)">Remove</button>
            <button class="decrementBtn" (click)="decrement(item)">-</button>


        </aside>
        }

    </section>





    <article>

        <p>Total Products : {{totalProducts()}} </p>
        <p>Total Amount : {{totalAmount() | number | currency}}</p>

        <button class="clearCartBtn" (click)="clearCartfromLS()">Clear Cart</button>

    </article>

</main>
